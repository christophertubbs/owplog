# Select this file at application startup. Values are unquoted.
[logger]
level = debug
format = %(name)s %(levelname)s %(message)s
handlers = terminal, application, audit
force = false

[handler.terminal]
class = ConsoleHandler
stderr_for_errors = true
suppress_captured_streams = true

[handler.application]
class = FileHandler
path = application.log
append = true

[handler.audit]
class = FileHandler
path = audit.log
append = true
