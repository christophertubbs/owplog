# Sample owplog configuration matching examples/e2e/native_main.cpp.
#
# Equivalent e2e constants:
#   LOG_LEVEL = Trace
#   LOG_PATTERN = %T [%L] (%N) %f:%l %F rank=%r lang=%g %m
#   APPLICATION_NAME = End2End
#   LOG_PATH = ${cwd}/End2End.log
#   WRITE_TO_CONSOLE = true
#   APPEND_TO_LOG = false
#
# This format is parsed by the prototype configuration engine in
# include/configuration.hpp and src/configuration.cpp.

application.name = End2End

logger.level = trace
formatter.pattern = %T [%L] (%N) %f:%l %F rank=%r lang=%g %m

handlers.console.enabled = true
handlers.console.stderr_for_errors = true
handlers.console.suppress_captured_streams = true

handlers.file.enabled = true
handlers.file.path = ${cwd}/${application_name}.log
handlers.file.append = false

capture_stdio = true
capture_stdout = true
capture_stderr = true
