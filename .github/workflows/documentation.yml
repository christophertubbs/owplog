name: Generate documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the revision
        uses: actions/checkout@v4

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen graphviz

      - name: Generate documentation
        run: |
          doxygen --version
          bash scripts/docs.sh

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: owplog-documentation
          path: build/docs/html/
          if-no-files-found: error
          retention-days: 30

      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owplog-documentation-warnings
          path: build/docs/warnings.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html/

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
